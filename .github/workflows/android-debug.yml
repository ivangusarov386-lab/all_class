name: All-Class Android DEMO debug APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: node scripts/verify_android_assets.mjs
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p apk-artifact
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-artifact/APK-METADATA.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee apk-artifact/APK-PERMISSIONS.txt
          cp "$APK" apk-artifact/All-Class-DEMO-1.0-debug.apk
          cd apk-artifact
          sha256sum All-Class-DEMO-1.0-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: All-Class-DEMO-1.0-debug
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 30
